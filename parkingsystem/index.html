<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Parking Management System</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #2f3640;
      height: 100vh;
      color: #fff;
    }

    .container {
      width: 75%;
      margin: 0 auto;
      padding-top: 10px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .header i {
      color: #0d6efd;
      font-size: 18px;
    }

    .header h2 {
      font-size: 20px;
      font-weight: 400;
    }

    .line {
      border: none;
      height: 1px;
      background: #b0b0b0;
      margin-bottom: 55px;
    }

    .login-box {
      width: 330px;
      background: #f5f5f5;
      margin: auto;
      padding: 25px 20px;
      border-radius: 4px;
      color: #555;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .login-title {
      text-align: center;
      margin-bottom: 20px;
      color: #555;
      font-size: 18px;
      font-weight: 500;
    }

    .login-title i {
      color: #0d6efd;
      margin-right: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 2px;
      outline: none;
      font-size: 13px;
    }

    .form-group input:focus {
      border-color: #0d6efd;
    }

    .login-btn {
      width: 100%;
      background: #0d6efd;
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #0b5ed7;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <i class="fa-solid fa-car"></i>
      <h2>Simple Parking Management System</h2>
    </div>

    <hr class="line" />

    <div class="login-box">

      <div class="login-title">
        <i class="fa-solid fa-right-to-bracket"></i>
        Admin Login
      </div>

      <form>
        <div class="form-group">
          <label>Username</label>
          <input type="text" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" />
        </div>

        <a href="a1.html" style="display: block;">
          <button type="button" class="login-btn">
            Login
          </button>
        </a>
      </form>

    </div>

  </div>
</body>
</html>
